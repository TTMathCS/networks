site_name: Networks
site_url: https://networks.akadian.ca/
site_description: 'Computer networks and their security, from the first idea to research: theory, math, wireless and hands-on labs'
repo_url: https://github.com/TTMathCS/networks
edit_uri: edit/main/docs/
copyright: 'Part of <a href="https://www.akadian.ca/">Mars – your new home</a> · Text and diagrams <span class="ai-tag">AI-created</span>, checked against the sources on each page'
exclude_docs: |
  README.md

theme:
  name: material
  custom_dir: overrides
  favicon: assets/akadian-icon.png   # the Akadian A, as on akadian.ca
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunset-up
        name: Mars dawn
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mars night
  font: false

extra_css:
  - fonts/fonts.css
  - stylesheets/mars.css
  - stylesheets/net.css
  - stylesheets/reader.css
  - stylesheets/sketch.css
  - katex/katex.min.css

extra:
  homepage: https://www.akadian.ca/

extra_javascript:
  - https://www.akadian.ca/home-music.js?site   # the song from www.akadian.ca: it goes on here while it plays (Mars-Home home-music.js)
  - javascripts/mars-link.js
  - javascripts/home-link.js
  - katex/katex.min.js
  - katex/auto-render.min.js
  - javascripts/math.js
  - javascripts/levels.js
  - javascripts/reader.js
  - javascripts/levelcheck.js

markdown_extensions:
  - toc:
      permalink: true
      title: On this page
  - tables
  - admonition
  - pymdownx.details
  - md_in_html
  - attr_list
  - pymdownx.highlight:
      line_spans: __span
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

# With --strict, a broken link or #anchor stops the build
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

